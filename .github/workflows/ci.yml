name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kinmu_test
          POSTGRES_PASSWORD: kinmu
          POSTGRES_USER: kinmu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinmu -d kinmu_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kinmu:kinmu@localhost:5432/kinmu_test
      TEST_DATABASE_URL: postgresql://kinmu:kinmu@localhost:5432/kinmu_test

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm with Corepack
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Check types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Prepare isolated browser database
        env:
          PGPASSWORD: kinmu
        run: createdb --host localhost --username kinmu kinmu_e2e

      - name: Migrate browser database
        env:
          DATABASE_URL: postgresql://kinmu:kinmu@localhost:5432/kinmu_e2e
        run: pnpm db:migrate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests against production build
        env:
          APP_URL: http://127.0.0.1:3190
          DATABASE_URL: postgresql://kinmu:kinmu@localhost:5432/kinmu_e2e
          E2E_BASE_URL: http://127.0.0.1:3190
          SESSION_SECRET: isolated-ci-session-secret-not-for-production
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: /tmp/kinmu-os-playwright
          if-no-files-found: ignore

      - name: Audit all dependencies
        run: pnpm security:audit

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: List production dependency licenses
        run: pnpm licenses:check
